services:
  - type: web
    name: wheelwash-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: YOLO_AUTOSTART
        value: "false"
      # Reach the YOLO26 service over Render's private network (host:port, http:// is added by the backend)
      - key: YOLO_URL
        fromService:
          type: web
          name: wheelwash-yolo
          property: hostport
      - key: YOLO_TIMEOUT_MS
        value: "8000"
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h

  # YOLO26 truck-vs-human detector. PyTorch does not fit the free plan, so this needs a paid instance.
  - type: web
    name: wheelwash-yolo
    runtime: docker
    dockerfilePath: ./backend/yolo/Dockerfile
    dockerContext: ./backend/yolo
    healthCheckPath: /health
    plan: starter
